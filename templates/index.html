{% extends "base.html" %}

{% block title %}Accueil - CVMatch{% endblock %}

{% block content %}
<style>
  /* Background animé dégradé */
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Fade in up pour textes */
  @keyframes fadeInUp {
    0% { opacity: 0; transform: translateY(30px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* Pulse glow bouton */
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 10px rgba(59,130,246,0.7); }
    50% { box-shadow: 0 0 20px rgba(59,130,246,1); }
  }

  body, html {
    height: 100%;
    margin: 0;
  }

  .animated-bg {
    background: linear-gradient(270deg, #2563eb, #9333ea, #3b82f6, #8b5cf6);
    background-size: 800% 800%;
    animation: gradientBG 15s ease infinite;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2rem;
  }

  .glass {
    background: rgba(255 255 255 / 0.15);
    backdrop-filter: blur(12px);
    border-radius: 2rem;
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    max-width: 700px;
    padding: 3rem;
    color: white;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  h1 {
    font-size: 3.5rem;
    font-weight: 900;
    margin-bottom: 1rem;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1rem;
    animation: fadeInUp 1s ease forwards;
  }

  h1 svg {
    width: 50px;
    height: 50px;
    color: #93c5fd;
    animation: pulseGlow 3s infinite;
  }

  p {
    font-size: 1.25rem;
    margin-bottom: 2.5rem;
    line-height: 1.6;
    animation: fadeInUp 1s ease forwards;
    animation-delay: 0.3s;
    opacity: 0;
    animation-fill-mode: forwards;
  }

  p span.highlight {
    color: #bfdbfe;
    font-weight: 700;
  }

  button.start-btn {
    font-size: 1.25rem;
    background-color: #2563eb;
    padding: 1rem 3rem;
    border-radius: 9999px;
    font-weight: 700;
    border: none;
    color: white;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(59,130,246,0.7);
    transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
    animation: fadeInUp 1s ease forwards;
    animation-delay: 0.6s;
    opacity: 0;
    animation-fill-mode: forwards;
  }

  button.start-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 30px rgba(59,130,246,1);
    background-color: #1e40af;
  }

  /* Formes abstraites animées en background */
  .circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.15;
    filter: blur(60px);
    animation: floatUpDown 6s ease-in-out infinite;
  }
  .circle1 {
    width: 300px;
    height: 300px;
    background: #3b82f6;
    top: -80px;
    left: -80px;
  }
  .circle2 {
    width: 200px;
    height: 200px;
    background: #8b5cf6;
    bottom: -60px;
    right: -60px;
    animation-delay: 3s;
  }

  @keyframes floatUpDown {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }
</style>

<div class="animated-bg bg-white dark:bg-gray-900 transition-colors duration-500">
  <div class="glass text-black dark:text-white transition-colors duration-500">
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>

   

    <h1>
      
      Bienvenue sur CVMatch
    </h1>

    <p>
      Trouvez le <span class="highlight">travail parfait</span> en quelques clics ! Notre plateforme analyse votre CV et vous propose les offres du travail qui correspondent le mieux à votre profil.
    </p>

    <button class="start-btn" onclick="window.location.href='/signup'">Commencer</button>
  </div>
</div>


{% endblock %}
